name: iOS
# Needs an Apple Developer account. Without the secrets below the job fails at signing - it never fabricates an IPA.
# Secrets: IOS_CERT_P12_B64, IOS_CERT_PASSWORD, IOS_PROFILE_B64, IOS_PROFILE_NAME, APPLE_TEAM_ID
on:
  workflow_dispatch:
    inputs:
      method: { description: 'development | ad-hoc | app-store-connect', default: development }
jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Import certificate and profile
        env:
          CERT: ${{ secrets.IOS_CERT_P12_B64 }}
          CERT_PW: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_B64 }}
        run: |
          KC="$RUNNER_TEMP/build.keychain"; PW="$(uuidgen)"
          security create-keychain -p "$PW" "$KC"; security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$PW" "$KC"; security list-keychains -d user -s "$KC" login.keychain
          echo "$CERT" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PW" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$PW" "$KC"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE" | base64 -d > "$HOME/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision"
      - name: Build IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
        run: bash scripts/build-ios.sh "${{ inputs.method }}"
      - uses: actions/upload-artifact@v4
        with: { name: apex-gp-ipa, path: build-output/ios/*.ipa }
