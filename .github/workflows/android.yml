name: Android
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      HAVE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Debug APK (always)
        run: bash scripts/build-android.sh debug
      - uses: actions/upload-artifact@v4
        with: { name: apex-gp-debug-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
      - name: Signed release APK/AAB (only when signing secrets exist)
        if: ${{ env.HAVE_KEYSTORE == 'true' }}
        env:
          APEX_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          APEX_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          APEX_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          APEX_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$APEX_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export APEX_KEYSTORE="$RUNNER_TEMP/release.jks"
          bash scripts/build-android.sh release apk
          bash scripts/build-android.sh release aab
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('android/app/build/outputs/apk/release/app-release.apk') != '' }}
        with: { name: apex-gp-release, path: "android/app/build/outputs/*/release/app-release.*" }
